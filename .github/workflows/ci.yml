name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fetch WSD specs
        shell: pwsh
        run: ./scripts/Get-WsdSpecs.ps1

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: |
          cargo clippy -p fakescan --all-targets -- -D warnings
          cargo clippy -p fakescan-mcp --all-targets -- -D warnings

      - name: test
        run: |
          cargo test -p fakescan
          cargo test -p fakescan-mcp

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build and compose smoke
        run: |
          docker compose build
          docker compose up -d --wait
          curl -fsS http://127.0.0.1:3920/health
          curl -fsS http://127.0.0.1:3920/v1/status | tee status.json
          grep -q brother-wsd status.json
          curl -fsS -X POST http://127.0.0.1:3920/v1/pages \
            -H 'content-type: application/json' -d '{"count":1}'
          curl -fsS -X POST http://127.0.0.1:3920/ScannerService \
            -H 'content-type: application/soap+xml' \
            --data-binary @scripts/fixtures/get_scanner_elements.xml \
            | tee soap.xml
          grep -q ScannerDescription soap.xml
          docker compose down

  # Linux client path: SANE + sane-airscan against Dockerized fakescan (manual WSD URL).
  # See docs/linux-client.md. Listing/open required; acquire best-effort.
  linux-sane:
    name: linux sane-airscan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install sane-airscan
        run: |
          sudo apt-get update
          sudo apt-get install -y sane-utils sane-airscan

      - name: Build and start fakescan
        run: |
          docker compose build
          docker compose up -d --wait

      - name: SANE smoke
        run: bash scripts/linux-sane-smoke.sh

      - name: Stop compose
        if: always()
        run: docker compose down
